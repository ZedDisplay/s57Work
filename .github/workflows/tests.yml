name: Tests

on:
  push:
  pull_request:

# The jobs only read the repo and run its Python; the token needs
# nothing more, and the checked-out tree must not carry it.
permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Run unit tests (pipeline test skips without GDAL/tippecanoe)
        run: python3 -m unittest discover -s tests -t . -v

  pipeline:
    name: End-to-end pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The Python the mesh packages are pinned for (mesh/requirements.txt),
      # as the mesh workflow sets it. Without this the job takes the runner's
      # own Python: on ubuntu-26.04 that is 3.14, for which the pinned
      # triangle has no build, so the install failed before any test ran
      # (2026-11-18).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # CGAL, GMP and MPFR: build-mesh.py compiles mesh/exact_cut.cpp with them
      # (tests/test_mesh_build.py, tests/test_mesh_pipeline.py).
      - name: Install GDAL, CGAL, pyyaml and the mesh packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin build-essential libsqlite3-dev zlib1g-dev zstd \
            libcgal-dev libgmp-dev libmpfr-dev
          pip install pyyaml -r mesh/requirements.txt
          ogrinfo --version
      - name: Install tippecanoe (same pinned version as the chart build)
        env:
          TIPPECANOE_VERSION: "2.79.0"
        run: |
          git clone --depth 1 --branch "$TIPPECANOE_VERSION" https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          cd /tmp/tippecanoe && make -j$(nproc) && sudo make install
          tippecanoe --version
      - name: Install go-pmtiles (writes the .pmtiles copy)
        env:
          # Pinned like tippecanoe; bump deliberately.
          PMTILES_VERSION: "1.31.2"
        run: |
          curl -fsSL "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz" \
            | tar xz -C /tmp pmtiles
          sudo install -m 755 /tmp/pmtiles /usr/local/bin/pmtiles
          pmtiles version
      - name: Run the full suite
        run: python3 -m unittest discover -s tests -t . -v
